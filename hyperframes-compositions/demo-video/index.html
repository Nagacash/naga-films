<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Naga Film</title>
  <style>
    body {
      margin: 0;
      background: #030303;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }

    [data-composition-id="root"] {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: radial-gradient(circle at center, #1a1a1a 0%, #030303 100%);
    }

    .scene-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px;
      box-sizing: border-box;
      text-align: center;
    }

    .title {
      font-size: 120px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      color: #00ff88;
      text-shadow: 0 0 40px rgba(217, 255, 0, 0.3);
    }

    .subtitle {
      font-size: 32px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Track line animation */
    .line {
      width: 0%;
      height: 2px;
      background: #00ff88;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div data-composition-id="root" data-width="1920" data-height="1080">
    
    <!-- Scene 1 -->
    <div id="scene-1" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="scene-content">
        <div class="title">Naga Film</div>
        <div class="subtitle">Naga Films Studio</div>
        <div class="line"></div>
      </div>
    </div>

    <!-- Framework Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      
      const tl = gsap.timeline({ paused: true });

      // Scene 1 Entrances
      tl.from(".title", {
        y: 100,
        opacity: 0,
        duration: 1.2,
        ease: "expo.out"
      }, 0.2);

      tl.from(".subtitle", {
        y: 40,
        opacity: 0,
        duration: 1,
        ease: "power3.out"
      }, 0.6);

      tl.to(".line", {
        width: "300px",
        duration: 1.5,
        ease: "power4.inOut"
      }, 0.8);

      // Register timeline
      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
